name: Tests

# Veroeffentlicht wird ueber die Vercel-GitHub-Integration (jeder Push auf main).
# Dieser Ablauf prueft nur die Rechenlogik und den Zaehler.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rechenlogik und Zaehler testen
        run: node --test
